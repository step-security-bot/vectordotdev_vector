version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00" # UTC
    labels:
      - "domain: deps"
      - "no-changelog"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 100
    groups:
      patches:
        applies-to: version-updates
        patterns:
        - "*"
        update-types:
        - "patch"

      amq:
        patterns:
        - "amq-*"
      aws:
        patterns:
        - "aws-*"
      azure:
        patterns:
        - "azure_*"
      clap:
        patterns:
        - "clap*"
      crossbeam:
        patterns:
        - "crossbeam*"
      csv:
        patterns:
        - "csv*"
      futures:
        patterns:
        - "futures"
        - "futures-util"
      graphql:
        patterns:
        - "async-graphql*"
      metrics:
        patterns:
        - "metrics"
        - "metrics-tracing-context"
        - "metrics-util"
      netlink:
        patterns:
        - "netlink-*"
      phf:
        patterns:
        - "phf*"
      prost:
        patterns:
        - "prost"
        - "prost-*"
      serde:
        patterns:
          - "serde"
          - "serde_*"
      tokio:
        patterns:
          - "tokio"
          - "tokio-*"
      tonic:
        patterns:
        - "tonic"
        - "tonic-*"
      tower:
        patterns:
        - "tower"
        - "tower-*"
      tracing:
        patterns:
          - "tracing"
          - "tracing-*"
      wasm-bindgen:
        patterns:
        - "wasm-bindgen-*"
      zstd:
        patterns:
        - "zstd*"
  - package-ecosystem: "docker"
    directory: "/distribution/docker/alpine"
    schedule:
      interval: "monthly"
      time: "04:00" # UTC
    labels:
      - "domain: releasing"
      - "no-changelog"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 100
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/distribution/docker/debian"
    schedule:
      interval: "monthly"
      time: "04:00" # UTC
    labels:
      - "domain: releasing"
      - "no-changelog"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 100
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/distribution/docker/distroless-static"
    schedule:
      interval: "monthly"
      time: "04:00" # UTC
    labels:
      - "domain: releasing"
      - "no-changelog"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 100
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/distribution/docker/distroless-libc"
    schedule:
      interval: "monthly"
      time: "04:00" # UTC
    labels:
      - "domain: releasing"
      - "no-changelog"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 100
    groups:
      docker-images:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "domain: ci"
      - "no-changelog"
    commit-message:
      prefix: "chore(ci)"
    groups:
      artifact:
        patterns:
        - "actions/download-artifact"
        - "actions/upload-artifact"
  - package-ecosystem: "npm"
    directory: "website/"
    schedule:
      interval: "monthly"
      time: "05:00" # UTC
    labels:
      - "dependencies"
      - "javascript"
      - "no-changelog"
    commit-message:
      prefix: "chore(website deps)"
    open-pull-requests-limit: 50
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /regression
    schedule:
      interval: daily

  - package-ecosystem: bundler
    directory: /scripts
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /scripts/cross
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /scripts/environment
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /tests/e2e
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /tests/e2e/datadog-metrics/dogstatsd_client
    schedule:
      interval: daily

  - package-ecosystem: pip
    directory: /tests/e2e/datadog-metrics/dogstatsd_client
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /tests/integration/dnstap/data
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /tilt
    schedule:
      interval: daily

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: daily
